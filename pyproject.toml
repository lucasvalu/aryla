[project]
name = "aryla"
version = "0.1.0"
description = "Terminal assistant that routes requests to specialist agents (LangGraph + MCP + Ollama)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain[mcp]>=1.4.7,<2",
    "langchain-ollama>=1.1,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
tracing = ["langfuse>=4,<5"]

[project.scripts]
aryla = "aryla.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "pyright>=1.1.400",
    "types-pyyaml",
    "langgraph-cli[inmem]>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aryla"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "eval: runs against the real Ollama model (slow; run on demand with -m eval)",
]
addopts = "-m 'not eval'"
filterwarnings = [
    "ignore:.*langchain.mcp.*beta.*",
]
