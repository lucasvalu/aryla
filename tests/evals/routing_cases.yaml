# Routing evaluation set: (user message, expected agent). Runs against the real model
# with `uv run pytest -m eval` or `uv run python scripts/routing_eval.py`.
# Add a case for every routing bug found in use. Target: >= 90% accuracy.

cases:
  # coding
  - message: "explain what this function does"
    expected: coding
  - message: "review this Python snippet for bugs"
    expected: coding
  - message: "write a shell script that renames files by date"
    expected: coding
  - message: "what does aryla/graph/builder.py do?"
    expected: coding
  - message: "why doesn't this regex match an email address?"
    expected: coding
  - message: "what is the difference between a list and a tuple in Python?"
    expected: coding
  - message: "how does Python's garbage collector work?"
    expected: coding
  - message: "write a SQL query that returns the top 10 customers by revenue"
    expected: coding
  - message: "convert this JavaScript function to TypeScript"
    expected: coding
  - message: "which files in the workspace import the settings module?"
    expected: coding
  - message: "find where the function build_graph is defined"
    expected: coding
  - message: "add type hints to this function"
    expected: coding
  - message: "what are the SOLID principles in object-oriented programming?"
    expected: coding
  - message: "best practices for writing commit messages?"
    expected: coding
  - message: "explain recursion with a code example"
    expected: coding
  - message: "my pytest fixture is not found, what could be wrong?"
    expected: coding
  - message: "write a Dockerfile for a FastAPI app"
    expected: coding
  - message: "what does the README in this repo say about setup?"
    expected: coding
  - message: "refactor this loop into a list comprehension"
    expected: coding
  - message: "what is a directed acyclic graph and how would I implement one?"
